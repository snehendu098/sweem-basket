specVersion: 1.0.0
description: Aave V3 reserves on Base Sepolia — supply rate, supply size and
  oracle price for yield routing.
repository: https://github.com/
schema:
  file: ./schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum
    name: PoolConfigurator
    network: base-sepolia
    source:
      address: "0x347Ae6820F48e9Dd563235742d89FAef6ffCaA72"
      abi: PoolConfigurator
      startBlock: 6719154
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Reserve
        - PriceOracle
        - PriceOracleAsset
      abis:
        - name: PoolConfigurator
          file: ./abis/PoolConfigurator.json
        - name: Pool
          file: ./abis/Pool.json
        - name: PoolAddressesProvider
          file: ./abis/PoolAddressesProvider.json
        - name: AaveOracle
          file: ./abis/AaveOracle.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: ReserveInitialized(indexed address,indexed
            address,address,address,address)
          handler: handleReserveInitialized
  - kind: ethereum
    name: Pool
    network: base-sepolia
    source:
      address: "0x07eA79F68B2B3df564D0A34F8e19D9B1e339814b"
      abi: Pool
      startBlock: 6719154
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Reserve
        - PriceOracle
        - PriceOracleAsset
        - ReserveHourlySnapshot
      abis:
        - name: Pool
          file: ./abis/Pool.json
        - name: PoolConfigurator
          file: ./abis/PoolConfigurator.json
        - name: PoolAddressesProvider
          file: ./abis/PoolAddressesProvider.json
        - name: AaveOracle
          file: ./abis/AaveOracle.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: ReserveDataUpdated(indexed
            address,uint256,uint256,uint256,uint256,uint256)
          handler: handleReserveDataUpdated
