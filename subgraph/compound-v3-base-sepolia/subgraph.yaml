specVersion: 1.0.0
description: Compound III (Comet) cUSDCv3 market on Base Sepolia — supply rate,
  utilization and TVL.
repository: https://github.com/
schema:
  file: ./schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum
    name: Comet
    network: base-sepolia
    source:
      address: "0x571621Ce60Cebb0c1D442B5afb38B1663C6Bf017"
      abi: Comet
      startBlock: 7646646
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/comet.ts
      entities:
        - Market
        - MarketConfiguration
        - MarketAccounting
        - MarketHourlySnapshot
        - BaseToken
        - Token
      abis:
        - name: Comet
          file: ./abis/Comet.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Supply(indexed address,indexed address,uint256)
          handler: handleSupply
        - event: Withdraw(indexed address,indexed address,uint256)
          handler: handleWithdraw
        - event: AbsorbDebt(indexed address,indexed address,uint256,uint256)
          handler: handleAbsorbDebt
        - event: BuyCollateral(indexed address,indexed address,uint256,uint256)
          handler: handleBuyCollateral
        - event: WithdrawReserves(indexed address,uint256)
          handler: handleWithdrawReserves
      blockHandlers:
        - handler: handleInit
          filter:
            kind: once
